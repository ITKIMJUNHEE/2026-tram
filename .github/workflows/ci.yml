name: CI

"on":
  push:
    branches: [main]

permissions:
  contents: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: server
            context: ./server
            image: ghcr.io/itkimjunhee/2026-tram-server
          - name: client
            context: ./client
            image: ghcr.io/itkimjunhee/2026-tram-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (${{ matrix.name }})
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update image tags in k8s manifests
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i -E "s|image: .*2026-tram-server(:.*)?|image: ${REGISTRY}/itkimjunhee/2026-tram-server:${SHORT_SHA}|" k8s/server.yaml
          sed -i -E "s|image: .*2026-tram-client(:.*)?|image: ${REGISTRY}/itkimjunhee/2026-tram-client:${SHORT_SHA}|" k8s/client.yaml
          sed -i "/imagePullPolicy: IfNotPresent/d" k8s/server.yaml k8s/client.yaml

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/server.yaml k8s/client.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi
          git commit -m "chore: update image tags to ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
