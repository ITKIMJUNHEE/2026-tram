services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tram
      POSTGRES_PASSWORD: tram
      POSTGRES_DB: tram_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tram -d tram_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./backend
    environment:
      # 컨테이너 네트워크 안에서는 서비스 이름(postgres)이 곧 호스트명이 되므로
      # 로컬 개발용 .env의 localhost:5432 대신 postgres:5432를 사용한다.
      DATABASE_URL: postgresql://tram:tram@postgres:5432/tram_db
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

  client:
    build: ./frontend
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  pgdata:
