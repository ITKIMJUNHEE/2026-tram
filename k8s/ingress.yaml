apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tram-ingress
  namespace: tram
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.middlewares: "tram-https-redirect@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - oasis-tram.duckdns.org
      secretName: oasis-tram-tls
  rules:
    # host 지정 규칙: oasis-tram.duckdns.org로 접속 시 사용
    - host: oasis-tram.duckdns.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 80
    # host 미지정 catch-all 규칙: curl http://localhost/... (Host 헤더 없이) 접속 시 사용
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 80
