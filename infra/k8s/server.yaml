apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: tram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: ghcr.io/itkimjunhee/2026-tram-server:sha-aa598b3
          ports:
            - containerPort: 4000
          # JWT_SECRET, ADMIN_INITIAL_PASSWORD는 이 Secret에서 온다. Secret 자체는
          # git에 커밋하지 않고 클러스터에 직접 생성한다 (infra/k8s/README.md 참고).
          envFrom:
            - secretRef:
                name: server-secrets
          env:
            # DATABASE_URL 통짜 문자열 대신 DB_* 개별 값으로 분리해서, 비밀번호가
            # git에 평문으로 커밋되지 않도록 한다 (backend/src/db/connection.ts가
            # 이 값들을 조합한다). DB_PASSWORD는 postgres.yaml과 동일한
            # postgres-secrets Secret을 재사용한다.
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "tram"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              value: "tram_db"
            - name: PORT
              value: "4000"
            # k8s Service 이름(ml-service)이 호스트명이 된다.
            - name: ML_SERVICE_URL
              value: "http://ml-service:8000"
            # 관리자 대시보드의 인프라 도구 링크 (GET /api/admin/links)
            - name: ARGOCD_URL
              value: "https://argocd.oasis-tram.duckdns.org"
            - name: GRAFANA_URL
              value: "https://grafana.oasis-tram.duckdns.org"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: tram
spec:
  selector:
    app: server
  ports:
    - port: 4000
      targetPort: 4000
