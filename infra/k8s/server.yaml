apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: tram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: ghcr.io/itkimjunhee/2026-tram-server:sha-9ac3cb7
          ports:
            - containerPort: 4000
          # JWT_SECRET, ADMIN_INITIAL_PASSWORD는 이 Secret에서 온다. Secret 자체는
          # git에 커밋하지 않고 클러스터에 직접 생성한다 (infra/k8s/README.md 참고).
          envFrom:
            - secretRef:
                name: server-secrets
          env:
            # k8s Service 이름(postgres)이 호스트명이 된다.
            - name: DATABASE_URL
              value: "postgresql://tram:tram@postgres:5432/tram_db"
            - name: PORT
              value: "4000"
            # k8s Service 이름(ml-service)이 호스트명이 된다.
            - name: ML_SERVICE_URL
              value: "http://ml-service:8000"
            # 관리자 대시보드의 인프라 도구 링크 (GET /api/admin/links)
            - name: ARGOCD_URL
              value: "https://argocd.oasis-tram.duckdns.org"
            - name: GRAFANA_URL
              value: "https://grafana.oasis-tram.duckdns.org"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: tram
spec:
  selector:
    app: server
  ports:
    - port: 4000
      targetPort: 4000
