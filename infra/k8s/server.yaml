apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: tram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: ghcr.io/itkimjunhee/2026-tram-server:sha-e1a54f0
          ports:
            - containerPort: 4000
          env:
            # k8s Service 이름(postgres)이 호스트명이 된다.
            - name: DATABASE_URL
              value: "postgresql://tram:tram@postgres:5432/tram_db"
            - name: PORT
              value: "4000"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: tram
spec:
  selector:
    app: server
  ports:
    - port: 4000
      targetPort: 4000
