apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: tram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: ghcr.io/itkimjunhee/2026-tram-client:sha-4e2f940
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: tram
spec:
  selector:
    app: client
  ports:
    - port: 80
      targetPort: 80
